services:
  api:
    build: .
    container_name: claims-triage-api
    ports:
      - "8000:8000"
    environment:
      # Mock LLM by default — the API runs fully offline.
      # For real Azure OpenAI, set LLM_PROVIDER=azure and fill in the
      # AZURE_OPENAI_* variables in a .env file (see .env.example).
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=policy_clauses
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: claims-triage-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
